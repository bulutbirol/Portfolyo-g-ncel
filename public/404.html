<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · birolweb.dev</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #07080c; color: #fff; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 560px; }
    p.code { margin: 0 0 24px; font: 12px ui-monospace, Consolas, monospace; letter-spacing: .2em; color: #7a8090; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 4.5rem); font-weight: 600; letter-spacing: -.05em; line-height: 1.05; }
    p.lead { margin: 20px 0 0; color: #9aa0ae; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid rgba(255,255,255,.15); color: #fff; }
    a.primary { background: #fff; color: #07080c; border-color: #fff; }
    a:hover { border-color: rgba(255,255,255,.4); }
    a.primary:hover { background: rgba(255,255,255,.85); }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist.</h1>
    <p class="lead">The link may be old or mistyped. Bu sayfa bulunamadı; bağlantı eski ya da hatalı olabilir.</p>
    <nav>
      <a class="primary" href="/">Home</a>
      <a href="/tr/">Ana sayfa (TR)</a>
    </nav>
  </main>
</body>
</html>
